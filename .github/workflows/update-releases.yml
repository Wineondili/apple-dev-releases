name: Apple Release Notifier

# 让默认 GITHUB_TOKEN 具有写入仓库代码的权限
permissions:
  contents: write

on:
  schedule:                # 每 10 分钟检查一次
    - cron: "*/10 * * * *"
  workflow_dispatch:       # 手动触发调试

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      # 1) 拉取仓库
      - name: Checkout
        uses: actions/checkout@v4

      # 2) 安装 Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3) 安装依赖
      - name: Install dependencies
        run: pip install feedparser requests

      # 4) 运行脚本，推送通知，并输出 UPDATED/NO_CHANGE
      - name: Run fetch_rss.py
        id: fetch
        env:
          TG_BOT_TOKEN:  ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:    ${{ secrets.TG_CHAT_ID }}
          BARK_KEY_MAIN: ${{ secrets.BARK_KEY_MAIN }}
        run: |
          python scripts/fetch_rss.py | tee result.log
          if grep -q "UPDATED" result.log; then
            echo "status=updated" >> "$GITHUB_OUTPUT"
          else
            echo "status=nochange" >> "$GITHUB_OUTPUT"
          fi

      # 5) 只有有更新时才提交 releases.json
      - name: Commit & push releases.json
        if: steps.fetch.outputs.status == 'updated'
        run: |
          git config --global user.email "bot@users.noreply.github.com"
          git config --global user.name  "rss-bot"
          git add _data/releases.json
          git commit -m "chore: update releases.json [skip ci]" || echo "nothing to commit"
          git push
