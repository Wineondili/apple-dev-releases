jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install feedparser requests

      - name: Fetch RSS & Push
        id: fetch                   # ① 记个 ID，方便后面判断
        env:
          TG_BOT_TOKEN:  ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:    ${{ secrets.TG_CHAT_ID }}
          BARK_KEY_MAIN: ${{ secrets.BARK_KEY_MAIN }}
        run: python scripts/fetch_rss.py

      **# ② 只有脚本输出了 UPDATED 时才提交文件**
      - name: Commit & push releases.json
        if: steps.fetch.outcome == 'success' && contains(steps.fetch.outputs.stdout, 'UPDATED')
        run: |
          git config --global user.name  "rss-bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add _data/releases.json
          git commit -m "chore: update releases.json [skip ci]" || echo "No changes"
          git push
